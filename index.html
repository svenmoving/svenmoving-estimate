<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Moving Estimate</title>
<style>
:root{--bg:#f3f8f8;--card:#fff;--ink:#1a4549;--mute:#4f6f72;--line:#d3e3e4;--tape:#e97d13;--tapeink:#fff;--navy:#1a4549;--navyink:#fff;--teal:#0d8087;--sh:0 2px 8px rgba(26,69,73,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1c1d;--card:#12302f;--ink:#e8f3f3;--mute:#9fbfc1;--line:#24484a;--navy:#0f3135;--teal:#0d7279;--sh:none}}
:root[data-theme="dark"]{--bg:#0a1c1d;--card:#12302f;--ink:#e8f3f3;--mute:#9fbfc1;--line:#24484a;--navy:#0f3135;--teal:#0d7279;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.hd{background:var(--navy);color:var(--navyink);margin:0 -12px 14px;padding:14px 16px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.logo{height:70px;width:auto;display:block}
.brand{font-size:24px;font-weight:700;color:var(--tape);line-height:1}
h1{flex-basis:100%;font-size:30px;line-height:1.1;margin:6px 0 0;font-weight:800;text-transform:uppercase}
h1 .o{color:var(--tape)}
h2{font-size:19px;margin:18px 0 8px;font-weight:800;text-transform:uppercase}
.hd .btn.ghost{background:var(--tape);color:#fff;border:0;padding:10px 22px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.teal label{color:#d6f0f1}
.teal input,.teal select{background:#fff;color:#1a4549;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
input,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--tape);outline-offset:1px}
.full{grid-column:1/-1}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:7px;overflow-x:auto;padding:10px 0}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.tab.on{background:var(--tape);color:#fff;border-color:var(--tape)}
.tab b{background:var(--navy);color:#fff;border-radius:10px;padding:1px 8px;margin-left:7px;font-size:14px}
.item{display:flex;align-items:center;gap:8px;padding:10px;margin:0 -10px;border-radius:10px}
.item.sel{background:rgba(233,125,19,.12);box-shadow:inset 4px 0 0 var(--tape)}
.nm{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.25}.nm small{display:block;color:var(--mute);font-size:13px;font-weight:400;margin-top:2px}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;cursor:pointer}
.ctl button.plus{background:var(--tape);color:#fff;border-color:var(--tape);font-weight:700}
.ctl span{min-width:32px;text-align:center;font-weight:800;font-size:20px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;background:var(--tape);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:var(--navyink);border-top:4px solid var(--tape);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:9}
.bar .t{font-size:13px;opacity:.85}.bar .v{font-size:20px;font-weight:800;line-height:1.15}
.sum td{padding:6px 0;vertical-align:top}.sum td:last-child{text-align:right;white-space:nowrap;font-weight:600}
table{width:100%;border-collapse:collapse}
.big td{font-size:24px;font-weight:800;border-top:3px solid var(--tape);padding-top:12px}
textarea{width:100%;min-height:160px;font:14px/1.45 ui-monospace,monospace;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.hide{display:none}
.ban{background:var(--tape);color:#fff;border-radius:10px;padding:12px;margin-bottom:10px;font-size:15px;font-weight:600}
.ban .btn.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.en{flex:1;min-width:0}.ec{width:84px}.item .btn{padding:0;width:44px;height:44px}
</style>
</head>

<script>
var ROOMS={
"Living Room":[["Sofa, 3-seat",60],["Loveseat",40],["Sectional sofa",90],["Armchair",25],["Coffee table",10],["TV stand",20],["TV",15],["Bookcase",25],["Shelving unit",20],["Floor lamp",5],["Rug (rolled)",10],["Picture / mirror",3]],
"Kitchen / Dining":[["Dining table",40],["Chair",6],["Bar stool",6],["China cabinet / buffet",50],["Refrigerator",50],["Washer",30],["Dryer",30],["Freezer",40],["Microwave",5],["Kitchen island / cart",25]],
"Office":[["Desk",35],["Office chair",12],["File cabinet",15],["Bookcase",25],["Printer / monitor",5]],
"Garage":[["Workbench",40],["Metal shelving",25],["Tool chest on wheels",20],["Lawn mower",15],["Bicycle",12],["BBQ grill",20],["Ladder",8],["Toolbox",5]],
"Outdoor / Patio":[["Patio table",30],["Patio chair",8],["Lounge chair",12],["Umbrella",5],["Patio set",60],["Trampoline",40]],
"Boxes":[["Small box",1.5],["Medium box",3],["Large box",4.5],["Dish pack box",3],["Bag / bin",5]],
"Specialty":[["Upright piano",70],["Grand piano",150],["Safe",30],["Treadmill / gym equipment",50],["Pool table",100],["Aquarium",25],["Hot tub",120]]
};
var BOX=[["Small box",1.5],["Medium box",3],["Large box",4.5]],WARD=[["Wardrobe box",10]];
var BED=[["King bed",70],["Queen bed",60],["Twin bed",35],["Mattress King/Queen",30],["Dresser",30],["Tall dresser",35],["Nightstand",8],["Vanity",20],["Wardrobe",50],["Mirror",5],["Kids bed",30],["Bunk bed",60],["Crib / playpen",20],["Toy chest",8]];
(function(){var o={};Object.keys(ROOMS).forEach(function(k){o[k]=(k==="Boxes"||k==="Specialty")?ROOMS[k]:BOX.concat(ROOMS[k]);if(k==="Living Room"){for(var i=1;i<=5;i++)o["Bedroom "+i]=BOX.concat(WARD,BED)}if(k==="Garage")o["Basement"]=BOX.concat(ROOMS["Living Room"]);});ROOMS=o})();
var TRUCKS=[[400,"10' (up to 400 cu ft)"],[760,"15' (up to 760 cu ft)"],[1000,"20' (up to 1000 cu ft)"],[1700,"26' (up to 1700 cu ft)"]];
var S={room:"Living Room",qty:{},custom:{},view:"list"};
try{var raw=localStorage.getItem("moveEst");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
S.view="list";
var DEFAULT=JSON.stringify(ROOMS);S.edit=false;var pend="";
function saveCfg(){try{localStorage.setItem("moveEstCfg",JSON.stringify(ROOMS))}catch(e){}}
try{var cg=JSON.parse(localStorage.getItem("moveEstCfg")||"null");if(cg&&typeof cg==="object"){if(cg["Garage / Basement"]&&!cg["Garage"]){var m={};Object.keys(cg).forEach(function(k){if(k==="Garage / Basement"){m["Garage"]=cg[k];m["Basement"]=JSON.parse(DEFAULT)["Basement"]}else m[k]=cg[k]});cg=m;try{localStorage.setItem("moveEstCfg",JSON.stringify(cg))}catch(e){}}ROOMS=cg}}catch(e){}
var hadC=false;Object.keys(S.custom||{}).forEach(function(r){if(ROOMS[r]&&S.custom[r].length){hadC=true;S.custom[r].forEach(function(it){ROOMS[r].push(it)})}});S.custom={};if(hadC)saveCfg();
if(!ROOMS[S.room])S.room=Object.keys(ROOMS)[0];
var $=function(i){return document.getElementById(i)};
var FIELDS=["cName","cPhone","cFrom","cTo","movers","truck","hours","mrate","truckFee","extra","myEmail"];
try{var f=JSON.parse(localStorage.getItem("moveEstF")||"{}");FIELDS.forEach(function(k){if(f[k]!==undefined)$(k).value=f[k]})}catch(e){}
function save(){try{localStorage.setItem("moveEst",JSON.stringify(S));var f={};FIELDS.forEach(function(k){f[k]=$(k).value});localStorage.setItem("moveEstF",JSON.stringify(f))}catch(e){}}
function itemsOf(r){return ROOMS[r]||[]}
function roomCount(r){var n=0;itemsOf(r).forEach(function(it){n+=S.qty[r+"|"+it[0]]||0});return n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function renderTabs(){$("tabs").innerHTML=Object.keys(ROOMS).map(function(r){var n=roomCount(r);return '<button class="tab'+(r===S.room?' on':'')+'" data-r="'+esc(r)+'">'+esc(r)+(n?'<b>'+n+'</b>':'')+'</button>'}).join("")+(S.edit?'<button class="tab" data-add="1">+ Room</button>':'')}
function renderItems(){
  if(S.edit){var h='<div class="row" style="margin-bottom:8px"><input id="rn" value="'+esc(S.room)+'" style="flex:1;min-width:140px" aria-label="Room name"><button class="btn ghost" data-act="delroom">'+(pend==="room"?"Tap again to delete":"Delete room")+'</button></div>';
    h+=itemsOf(S.room).map(function(it,i){return '<div class="item"><input class="en" data-i="'+i+'" value="'+esc(it[0])+'" aria-label="Item name"><input class="ec" data-i="'+i+'" type="number" inputmode="decimal" value="'+it[1]+'" aria-label="cu ft"><button class="btn ghost" data-act="del" data-i="'+i+'" aria-label="Delete item">\u2715</button></div>'}).join("");
    $("items").innerHTML=h;return}
  $("items").innerHTML=itemsOf(S.room).map(function(it,i){var q=S.qty[S.room+"|"+it[0]]||0;
    return '<div class="item'+(q?' sel':'')+'"><div class="nm">'+esc(it[0])+'<small>'+it[1]+' cu ft</small></div><div class="ctl"><button data-k="'+esc(it[0])+'" data-d="-1" aria-label="Minus">−</button><span>'+q+'</span><button class="plus" data-k="'+esc(it[0])+'" data-d="1" aria-label="Plus">+</button></div></div>'}).join("");
}
function totals(){var n=0,cf=0,rows=[];
  Object.keys(ROOMS).forEach(function(r){var lines=[];itemsOf(r).forEach(function(it){var q=S.qty[r+"|"+it[0]]||0;if(q){n+=q;cf+=q*it[1];lines.push([it[0],q,q*it[1]])}});if(lines.length)rows.push([r,lines])});
  return{n:n,cf:cf,rows:rows}}
function num(id){return parseFloat($(id).value)||0}
function calc(){var t=totals();var hrs=num("hours");
  var crew=num("movers")*num("mrate"),labor=hrs*crew,total=labor+num("truckFee")+num("extra");
  var CAP={"20 ft":1000,"26 ft":1700},truck=$("truck").value+(t.cf>(CAP[$("truck").value]||0)?" (volume may need 2 trips)":"");
  return{t:t,hrs:hrs,crew:crew,labor:labor,total:total,truck:truck}}
function money(x){return "$"+Math.round(x).toLocaleString("en-US")}
function render(){renderTabs();renderItems();var c=calc();
  $("barT").textContent=c.t.n+" items · "+c.truck;$("barV").textContent=Math.round(c.t.cf)+" cu ft · "+money(c.total);
  if(S.view==="sum"){
    $("calc").innerHTML='<tr><td>Volume</td><td>'+Math.round(c.t.cf)+' cu ft</td></tr><tr><td>Truck</td><td>'+c.truck+'</td></tr><tr><td>Crew</td><td>'+num("movers")+' movers · '+money(c.crew)+'/hr</td></tr><tr><td>Hours (your estimate)</td><td>'+c.hrs.toFixed(1)+'</td></tr><tr><td>Labor</td><td>'+money(c.labor)+'</td></tr><tr><td>Truck + extras</td><td>'+money(num("truckFee")+num("extra"))+'</td></tr><tr class="big"><td>Total</td><td>'+money(c.total)+'</td></tr>';
    $("list").innerHTML=c.t.rows.length?c.t.rows.map(function(r){return '<h2>'+esc(r[0])+'</h2><table class="sum">'+r[1].map(function(l){return '<tr><td>'+esc(l[0])+' × '+l[1]+'</td><td>'+Math.round(l[2])+' cu ft</td></tr>'}).join("")+'</table>'}).join(""):'<p style="color:var(--mute)">Nothing selected yet. Go back to the rooms and tap +.</p>';
    var s="MOVING ESTIMATE\n"+($("cName").value||"")+" "+($("cPhone").value||"")+"\nFrom: "+($("cFrom").value||"-")+"\nTo: "+($("cTo").value||"-")+"\n";
    c.t.rows.forEach(function(r){s+="\n"+r[0]+":\n";r[1].forEach(function(l){s+="- "+l[0]+" x"+l[1]+"\n"})});
    s+="\nVolume: "+Math.round(c.t.cf)+" cu ft\nTruck: "+c.truck+"\nMovers: "+num("movers")+"\nTime: ~"+c.hrs.toFixed(1)+" hrs\nTotal: "+money(c.total);
    $("txt").value=s}
  save()}
$("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;pend="";if(b.dataset.add){var n=1;while(ROOMS["New room "+n])n++;ROOMS["New room "+n]=[];S.room="New room "+n;saveCfg()}else S.room=b.dataset.r;render()};
function editAct(a){var act=a.dataset.act;
  if(act==="del"){var it=ROOMS[S.room][+a.dataset.i];delete S.qty[S.room+"|"+it[0]];ROOMS[S.room].splice(+a.dataset.i,1);pend="";saveCfg();render()}
  else if(act==="delroom"){if(pend!=="room"){pend="room";render();return}
    if(Object.keys(ROOMS).length<2){pend="";render();return}
    var r=S.room;delete ROOMS[r];Object.keys(S.qty).forEach(function(k){if(k.indexOf(r+"|")===0)delete S.qty[k]});S.room=Object.keys(ROOMS)[0];pend="";saveCfg();render()}}
$("items").addEventListener("change",function(e){var t=e.target;if(!S.edit)return;
  if(t.id==="rn"){var nn=t.value.trim(),old=S.room;if(!nn||nn===old||ROOMS[nn]){t.value=old;return}
    var o={};Object.keys(ROOMS).forEach(function(k){o[k===old?nn:k]=ROOMS[k]});ROOMS=o;
    Object.keys(S.qty).forEach(function(k){if(k.indexOf(old+"|")===0){S.qty[nn+k.slice(old.length)]=S.qty[k];delete S.qty[k]}});S.room=nn}
  else if(t.classList.contains("en")){var it=ROOMS[S.room][+t.dataset.i],nm=t.value.trim();if(!nm){t.value=it[0];return}var ok=S.room+"|"+it[0],nk=S.room+"|"+nm;if(S.qty[ok]!==undefined&&ok!==nk){S.qty[nk]=(S.qty[nk]||0)+S.qty[ok];delete S.qty[ok]}it[0]=nm}
  else if(t.classList.contains("ec")){ROOMS[S.room][+t.dataset.i][1]=parseFloat(t.value)||0}
  saveCfg();render()});
$("editBtn").onclick=function(){S.edit=!S.edit;pend="";$("editBtn").textContent=S.edit?"Done":"Edit";$("ban").classList.toggle("hide",!S.edit);if(S.edit&&S.view==="sum")$("toggle").click();render()};
$("clearAll").onclick=function(){var b=this;
  if(!b.dataset.s){b.dataset.s=1;b.textContent="Tap again to clear everything";setTimeout(function(){delete b.dataset.s;b.textContent="Clear all"},4000);return}
  S.qty={};FIELDS.slice(0,4).forEach(function(k){$(k).value=""});$("hours").value="";delete b.dataset.s;b.textContent="Clear all";S.room=Object.keys(ROOMS)[0];render();window.scrollTo(0,0)};
$("resetCfg").onclick=function(){if(pend!=="cfg"){pend="cfg";this.textContent="Tap again to restore defaults";return}ROOMS=JSON.parse(DEFAULT);try{localStorage.removeItem("moveEstCfg")}catch(e){}S.room=Object.keys(ROOMS)[0];pend="";this.textContent="Restore default list";render()};
$("items").onclick=function(e){var a=e.target.closest("button[data-act]");if(a){editAct(a);return}var b=e.target.closest("button[data-k]");if(!b)return;var k=S.room+"|"+b.dataset.k;S.qty[k]=Math.max(0,(S.qty[k]||0)+parseInt(b.dataset.d));render()};
$("cuAdd").onclick=function(){var n=$("cuName").value.trim(),v=parseFloat($("cuCf").value)||0;if(!n)return;ROOMS[S.room].push([n,v]);saveCfg();$("cuName").value="";$("cuCf").value="";render()};
$("toggle").onclick=function(){rstBtn();S.view=S.view==="list"?"sum":"list";$("v-list").classList.toggle("hide",S.view==="sum");$("v-sum").classList.toggle("hide",S.view==="list");$("toggle").textContent=S.view==="sum"?"Back to rooms":"Summary";window.scrollTo(0,0);render()};
FIELDS.forEach(function(k){$(k).addEventListener("input",render)});
$("copy").onclick=function(){var t=$("txt");t.select();try{navigator.clipboard.writeText(t.value).then(function(){$("copy").textContent="Copied"},function(){document.execCommand("copy");$("copy").textContent="Copied"})}catch(e){try{document.execCommand("copy");$("copy").textContent="Copied"}catch(x){}}};
$("submit").onclick=function(){var b=this,to=$("myEmail").value.trim();
  if(!to){b.textContent="Enter your email above";$("myEmail").focus();setTimeout(function(){b.textContent="Submit"},2500);return}
  var t=$("txt").value;try{navigator.clipboard.writeText(t)}catch(e){}
  var sub="Moving estimate: "+($("cName").value||"customer")+" "+($("cPhone").value||"");
  var a=document.createElement("a");a.href="mailto:"+to+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(t);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  b.textContent="Email draft opened";setTimeout(function(){b.textContent="Submit"},3000)};
function rstBtn(){delete $("reset").dataset.s;$("reset").textContent="Done: new customer"}
$("reset").onclick=function(){var b=$("reset");
  if(!b.dataset.s){b.dataset.s=1;var t=$("txt");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand("copy")}catch(x){}}b.textContent="Estimate copied. Tap again to clear";return}
  S.qty={};S.custom={};FIELDS.slice(0,4).forEach(function(k){$(k).value=""});$("hours").value="";S.room=Object.keys(ROOMS)[0];rstBtn();
  if(S.view==="sum")$("toggle").click();else render();window.scrollTo(0,0)};
render();
</script>
</body>
</html>
